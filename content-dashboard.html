  ["lantern","Lanterns of Mid-Autumn","中秋的花灯","文化","节日民俗","新闻","09-25",26000,.057,.55,.036,710,"A2 B1 B2"],
  ["popcorn","Why Does Popcorn Pop?","爆米花为什么会爆开","科学","科普冷知识","科普","09-24",18000,.091,.71,.049,560,"A1 A2 B1 B2"],
  ["halloween","Halloween Around the World","世界各地的万圣节","文化","节日民俗","新闻","10-27",180,.10,.60,.05,690,"A2 B1 B2"],
];
const MIN_EXP = 200;
const LV_D = { A1: .02, A2: .01, B1: -.01, B2: -.04 }; // completion offset by level version
const lenBucket = w => w < 700 ? "短篇 <700词" : w < 1000 ? "中篇 700–999" : "长篇 ≥1000";
const ARTS = RAW.map(r => {
  const a = { id: r[0], en: r[1], zh: r[2], cat: r[3], tag: r[4], genre: r[5], date: r[6], exp: r[7], ctr: r[8], comp: r[9], save: r[10], words: r[11], levels: r[12].split(" ") };
  a.opens = a.exp * a.ctr; a.reads = a.opens * a.comp; a.saves = a.reads * a.save; a.low = a.exp < MIN_EXP;
  return a;
});

/* ---------- derived ---------- */
const READ_BY_CAT = Object.fromEntries(CATS.map(c => [c, ARTS.filter(a => a.cat === c).reduce((s, a) => s + a.reads, 0)]));
const READ_ALL = Object.values(READ_BY_CAT).reduce((s, v) => s + v, 0);
const READ_SHARE = Object.fromEntries(CATS.map(c => [c, READ_BY_CAT[c] / READ_ALL])); // share of meaningful reads
const CELLS = CATS.flatMap(cat => LEVELS.map((lv, i) => {
  const [inv, wpr, nw] = CELL_RAW[cat][i];
  const weeks = inv / wpr, need = Math.max(0, Math.ceil(TARGET_WEEKS * wpr - inv));
  return { key: cat + "·" + lv, cat, lv, inv, wpr, nw, weeks, need,
    readers: Math.round(READERS * READ_SHARE[cat] * USER_LEVEL[lv]),
    st: weeks < 2 ? "crit" : weeks < TARGET_WEEKS ? "warn" : "good" };
}));
const INV_TOTAL = CELLS.reduce((s, c) => s + c.inv, 0);
const SHORT = CELLS.filter(c => c.st === "crit").length;

const DIMS = {
  "主题": a => a.cat, "标签": a => a.tag, "档位": null, "体裁": a => a.genre, "长度": a => lenBucket(a.words),
};
function rates(g) { return { ...g, ctr: g.opens / g.exp, comp: g.reads / g.opens, save: g.saves / g.reads, low: g.exp < MIN_EXP }; }
function agg(dim) {
  const G = {};
  const add = (k, exp, ctr, comp, save, id) => {
    const g = G[k] || (G[k] = { key: k, exp: 0, opens: 0, reads: 0, saves: 0, ids: new Set() });
    const o = exp * ctr, r = o * comp;
    g.exp += exp; g.opens += o; g.reads += r; g.saves += r * save; g.ids.add(id);
  };
  ARTS.forEach(a => {
    if (dim === "档位") {
      const tot = a.levels.reduce((s, l) => s + USER_LEVEL[l], 0);
      a.levels.forEach(l => add(l, a.exp * USER_LEVEL[l] / tot, a.ctr, a.comp + LV_D[l], a.save, a.id));
    } else add(DIMS[dim](a), a.exp, a.ctr, a.comp, a.save, a.id);
  });
  return Object.values(G).map(g => rates({ ...g, n: g.ids.size }));
}
const AVG = rates(ARTS.reduce((s, a) => ({ exp: s.exp + a.exp, opens: s.opens + a.opens, reads: s.reads + a.reads, saves: s.saves + a.saves }), { exp: 0, opens: 0, reads: 0, saves: 0 }));
const COMP_SERIES = COMP_D.map(d => AVG.comp + d);
const TOP_TAGS = Object.fromEntries(CATS.map(cat => [cat, agg("标签").filter(g => !g.low && ARTS.some(a => a.tag === g.key && a.cat === cat)).sort((x, y) => y.comp - x.comp).slice(0, 2).map(g => g.key)]));

/* ---------- state ---------- */
const S = { page: "overview", cell: null, dim: "主题", sort: "comp", dir: -1, pick: null, best: true };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString("en-US");
const pct = (v, d = 0) => (v * 100).toFixed(d) + "%";
const catDot = c => `<span class="cat"><i style="background:${CAT_C[c]}"></i>${c}</span>`;
const info = t => `<i class="info" tabindex="0" data-tip="${t}">i</i>`;
const deltaHtml = (cur, prev, inverse) => {
  const d = (cur - prev) / prev, good = inverse ? d < 0 : d > 0;
  return `<span class="delta ${good ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(1)}%</span>`;
};
const ppHtml = (v, avg) => {
  const d = (v - avg) * 100, cls = Math.abs(d) < 1 ? "flat" : d > 0 ? "up" : "down";
  return `<span class="pp ${cls}">${d > 0 ? "+" : ""}${d.toFixed(1)}</span>`;
};
const shortDelta = d => d ? `<span class="delta ${d > 0 ? "down" : "up"}">${d > 0 ? "▲ +" : "▼ "}${d} 格</span>` : `<span class="delta">持平</span>`;
const stPill = c => `<span class="pill ${c.st}">${c.weeks.toFixed(1)} 周</span>`;

function spark(values, color) {
  const w = 160, h = 30, mn = Math.min(...values), mx = Math.max(...values), r = mx - mn || 1;
  const pts = values.map((v, i) => [i / (values.length - 1) * w, h - 3 - (v - mn) / r * (h - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}

function lineChart(values, labels, color) {
  const W = 640, H = 230, L = 46, R = 14, T = 14, B = 26;
  const top = Math.ceil(Math.max(...values) * 1.1 / 2000) * 2000, step = top / 4;
  const x = i => L + i / (values.length - 1) * (W - L - R);
  const y = v => T + (1 - v / top) * (H - T - B);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v ? (v / 1000) + "k" : 0}</text>`;
  const pts = values.map((v, i) => [x(i), y(v)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join("");
  const area = line + `L${x(values.length - 1)} ${y(0)}L${x(0)} ${y(0)}Z`;
  const xl = labels.map((l, i) => i % 2 === 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${l}</text>` : "").join("");
  const cw = (W - L - R) / (values.length - 1);
  const hits = pts.map((p, i) => `<rect x="${p[0] - cw / 2}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent" data-tip="${labels[i]} 周 · <b>${fmt(values[i])}</b>"/>`).join("");
  const last = pts[pts.length - 1];
  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="WMR 周趋势">${g}<path d="${area}" fill="${color}" opacity=".1"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}" stroke="var(--panel)" stroke-width="2"/><text x="${last[0] - 6}" y="${last[1] - 10}" text-anchor="end" style="fill:var(--ink);font-weight:600">${fmt(values[values.length - 1])}</text>${xl}${hits}</svg>`;
}

/* ---------- page: 内容表现 ---------- */
function renderContent() {
  const rows = agg(S.dim);
  const key = S.sort, dir = S.dir;
  const ok = rows.filter(r => !r.low).sort((a, b) => (a[key] - b[key]) * dir), low = rows.filter(r => r.low);
  const th = (k, label, tip) => `<th class="sortable r" data-sort="${k}" tabindex="0" ${S.sort === k ? `aria-sort="${S.dir < 0 ? "descending" : "ascending"}"` : ""}>${label}${tip ? info(tip) : ""}</th>`;
  const lbl = r => S.dim === "主题" ? catDot(r.key) : r.key;
  const tr = r => `<tr class="click ${r.low ? "low" : ""} ${S.pick === r.key ? "sel" : ""}" data-pick="${r.key}" tabindex="0"><td>${lbl(r)}</td><td class="r">${r.n}</td><td class="r">${fmt(r.reads)}</td>${r.low ? `<td class="r" colspan="3">数据不足</td>` : `<td class="r">${pct(r.ctr, 1)}${ppHtml(r.ctr, AVG.ctr)}</td><td class="r">${pct(r.comp, 1)}${ppHtml(r.comp, AVG.comp)}</td><td class="r">${pct(r.save, 1)}${ppHtml(r.save, AVG.save)}</td>`}</tr>`;

  // supply vs demand by theme
  const sd = CATS.map(c => {
    const inv = CELLS.filter(x => x.cat === c).reduce((s, x) => s + x.inv, 0) / INV_TOTAL;
    return { c, read: READ_SHARE[c], inv, d: READ_SHARE[c] - inv };
  }).sort((a, b) => b.d - a.d);
  const sdMax = Math.max(...sd.map(r => Math.max(r.read, r.inv)));

  // article list
  let arts = ARTS.filter(a => !a.low);
  if (S.pick) arts = arts.filter(a => S.dim === "档位" ? a.levels.includes(S.pick) : DIMS[S.dim](a) === S.pick);
  arts.sort((a, b) => (b.comp - a.comp) * (S.best ? 1 : -1));
  arts = arts.slice(0, 10);
  const lowN = ARTS.filter(a => a.low).length;

  $("#p-content").innerHTML = `
    <div class="panel">
      <h3><span>按类型 · 近 4 周</span>

        <tbody>
          <tr class="avg"><td>全站平均</td><td class="r">${ARTS.length}</td><td class="r">${fmt(AVG.reads)}</td><td class="r">${pct(AVG.ctr, 1)}<span class="pp"></span></td><td class="r">${pct(AVG.comp, 1)}<span class="pp"></span></td><td class="r">${pct(AVG.save, 1)}<span class="pp"></span></td></tr>
          ${ok.map(tr).join("")}${low.map(tr).join("")}
        </tbody>
      </table></div>
    </div>
    <div class="grid g-52 row">
      <div class="panel">
        <h3><span>文章榜${S.pick ? ` · ${S.pick} <button type="button" class="clear" data-pick-clear>清除 ×</button>` : ""}</span>
          <span class="seg" role="group" aria-label="排序"><button type="button" data-best="1" aria-pressed="${S.best}">完读最高</button><button type="button" data-best="0" aria-pressed="${!S.best}">完读最低</button></span>
        </h3>
        <div class="tbl-wrap"><table>
          <thead><tr><th>文章</th><th>主题</th><th class="r">点开率</th><th class="r">有意义完读率</th><th class="r">收藏率</th></tr></thead>
          <tbody>${arts.map(a => `<tr><td class="title">${a.zh}<small>${a.en} · ${a.genre} · ${a.words} 词</small></td><td>${catDot(a.cat)}</td><td class="r">${pct(a.ctr, 1)}</td><td class="r">${pct(a.comp, 1)}${ppHtml(a.comp, AVG.comp)}</td><td class="r">${pct(a.save, 1)}</td></tr>`).join("")}</tbody>
        </table></div>

      </div>

}

  if (inf) { e.preventDefault(); e.stopPropagation(); const r = inf.getBoundingClientRect(); showTip(inf, r.left, r.bottom); return; }
  const cell = t.closest("[data-cell]");
  if (cell) { S.cell = cell.dataset.cell; rerender(); return; }
  const dim = t.closest("[data-dim]");
  if (dim) { S.dim = dim.dataset.dim; S.pick = null; rerender(); return; }
  const best = t.closest("[data-best]");
  if (best) { S.best = best.dataset.best === "1"; rerender(); return; }
  if (t.closest("[data-pick-clear]")) { S.pick = null; rerender(); return; }
  const sort = t.closest("th[data-sort]");
  if (sort) { if (S.sort === sort.dataset.sort) S.dir *= -1; else { S.sort = sort.dataset.sort; S.dir = -1; } rerender(); return; }
  const pick = t.closest("[data-pick]");
  if (pick) { S.pick = S.pick === pick.dataset.pick ? null : pick.dataset.pick; rerender(); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-cell], [data-pick], th[data-sort]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

const tip = $("#tip");
function showTip(el, cx, cy) {
  tip.innerHTML = el.dataset.tip; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = cx + 14, y = cy + 14;
  if (x + r.width > innerWidth - 8) x = Math.max(8, cx - r.width - 14);
  if (y + r.height > innerHeight - 8) y = cy - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  showTip(t, e.clientX, e.clientY);
});
document.addEventListener("focusin", e => { if (e.target.matches(".info")) { const r = e.target.getBoundingClientRect(); showTip(e.target, r.left, r.bottom); } });
document.addEventListener("focusout", () => tip.hidden = true);
document.addEventListener("scroll", () => tip.hidden = true, true);

let start = location.hash.slice(1);
if (!RENDER[start]) { try { start = localStorage.getItem("ylz-content-page") || "overview"; } catch (e) { start = "overview"; } }
show(start);
})();
</script>
